[project]
name = "bites-mcp"
version = "0.1.0"
description = "MCP server for publishing to a Bites deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bites-mcp = "bites_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bites_mcp"]
